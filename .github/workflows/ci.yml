name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: the workflow only needs to read the code.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  library:
    name: Library – lint, types, tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Actions are pinned to full commit SHAs (security concept C-17).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Guard – no raw radio captures in the repository
        run: |
          if git ls-files '*.jsonl' '*.pcap' '*.pcapng' | grep -v '^tests/.*/fixtures/.*\.anon\.jsonl$'; then
            echo "::error::Raw capture files must not be committed. Anonymise them with tools/anonymize_capture.py."
            exit 1
          fi

      - name: Install
        run: pip install -e ".[test]"

      - name: Ruff (lint, incl. Trojan-Source checks)
        run: ruff check --output-format=github .

      - name: Ruff (format)
        run: ruff format --check .

      - name: Mypy (strict)
        run: mypy

      - name: Bandit
        run: bandit -q -r custom_components -c pyproject.toml

      - name: Tests
        run: pytest

  integration:
    name: Integration – Home Assistant tests and types
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Install
        run: |
          pip install "pytest-homeassistant-custom-component==0.13.316" pytest-cov mypy
          pip install -e .

      - name: Mypy (strict)
        run: mypy --config-file tests/integration/mypy.ini custom_components/meshcom tests/integration

      - name: Tests
        run: >-
          pytest tests/integration -o addopts="" -o asyncio_mode=auto
          --cov --cov-config=tests/integration/.coveragerc

  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: home-assistant/actions/hassfest@86d4564712fa02543c808e3a693dd04f9d3f8361 # master 2026-11

  hacs:
    name: HACS validation
    # HACS can only validate public repositories.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa # main 2026-11
        with:
          category: integration
          # Brand assets and repository topics follow before the first release.
          ignore: brands topics
