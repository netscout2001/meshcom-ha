name: Release

# Creates the GitHub release (and its tag) that HACS offers as an update.
# Runs when the version in manifest.json or CHANGELOG.md changes on main,
# and only if no release for that version exists yet. The notes come from
# the matching section of CHANGELOG.md. A manually pushed tag vX.Y.Z works
# as well; it must match the manifest version.

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - custom_components/meshcom/manifest.json
      - CHANGELOG.md
      - .github/workflows/release.yml

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Create release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Determine version
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version=$(python3 -c "import json; print(json.load(open('custom_components/meshcom/manifest.json'))['version'])")
          if ! printf '%s' "${version}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Unexpected manifest version ${version}."
            exit 1
          fi
          if [ "${REF_TYPE}" = "tag" ] && [ "v${version}" != "${REF_NAME}" ]; then
            echo "::error::Tag ${REF_NAME} does not match manifest version ${version}."
            exit 1
          fi
          echo "tag=v${version}" >> "${GITHUB_OUTPUT}"

      - name: Skip if already released
        id: exists
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Release ${TAG} exists, nothing to do."
            echo "skip=true" >> "${GITHUB_OUTPUT}"
          fi

      - name: Extract release notes
        if: steps.exists.outputs.skip != 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          awk -v tag="## ${TAG}" '$0 == tag {found=1; next} /^## / && found {exit} found' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::CHANGELOG.md has no section for ${TAG}."
            exit 1
          fi

      - name: Create release
        if: steps.exists.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: >-
          gh release create "${TAG}" --repo "${GITHUB_REPOSITORY}"
          --title "${TAG}" --notes-file notes.md --target "${GITHUB_SHA}"
