name: Release

# A pushed tag vX.Y.Z creates the GitHub release that HACS offers as an
# update. The tag must match the version in manifest.json, and the notes
# come from the matching section of CHANGELOG.md.

on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  release:
    name: Create release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check tag against manifest version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(python3 -c "import json; print(json.load(open('custom_components/meshcom/manifest.json'))['version'])")
          if [ "v${version}" != "${TAG}" ]; then
            echo "::error::Tag ${TAG} does not match manifest version ${version}."
            exit 1
          fi

      - name: Extract release notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          awk -v tag="## ${TAG}" '$0 == tag {found=1; next} /^## / && found {exit} found' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::CHANGELOG.md has no section for ${TAG}."
            exit 1
          fi

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "${TAG}" --title "${TAG}" --notes-file notes.md --verify-tag
