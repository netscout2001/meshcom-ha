[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "aiomeshcom"
version = "0.0.1"
description = "Asyncio library for the MeshCom LoRa mesh (external UDP interface, web API, NET console)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
authors = [{ name = "netscout2001" }]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Framework :: AsyncIO",
    "Programming Language :: Python :: 3",
    "Topic :: Communications :: Ham Radio",
]
dependencies = []

[project.optional-dependencies]
test = [
    "pytest>=8",
    "pytest-cov>=5",
    "hypothesis>=6",
    "mypy>=1.13",
    "ruff>=0.8",
    "bandit>=1.8",
]

[project.urls]
Homepage = "https://github.com/netscout2001/meshcom-ha"
Issues = "https://github.com/netscout2001/meshcom-ha/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aiomeshcom = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --cov=aiomeshcom --cov-report=term-missing"

[tool.coverage.report]
fail_under = 95

[tool.mypy]
files = ["src", "tests"]
strict = true
python_version = "3.13"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "B", "UP", "S", "BLE", "ASYNC", "RUF", "SIM",
    "PL", "PT", "C4", "RET", "TRY", "PERF", "N",
]
ignore = ["PLR2004", "TRY003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004", "PLR0913"]

[tool.bandit]
exclude_dirs = ["tests"]
