[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "aiomeshcom"
version = "0.0.1"
description = "Asyncio library for the MeshCom LoRa mesh (external UDP interface, web API, NET console)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
authors = [{ name = "netscout2001" }]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Framework :: AsyncIO",
    "Programming Language :: Python :: 3",
    "Topic :: Communications :: Ham Radio",
]
dependencies = []

[project.optional-dependencies]
test = [
    "pytest>=8",
    "pytest-cov>=5",
    "hypothesis>=6",
    "mypy>=1.13",
    "ruff>=0.8",
    "bandit>=1.8",
]

[project.urls]
Homepage = "https://github.com/netscout2001/meshcom-ha"
Issues = "https://github.com/netscout2001/meshcom-ha/issues"

# The library lives inside the integration so that HACS ships it with the
# integration. It has no Home Assistant dependency and can be published to
# PyPI separately later.
[tool.setuptools]
packages = ["aiomeshcom"]
package-dir = { "aiomeshcom" = "custom_components/meshcom/aiomeshcom" }

[tool.setuptools.package-data]
aiomeshcom = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests/lib"]
addopts = "--strict-markers --cov=aiomeshcom --cov-report=term-missing"

[tool.coverage.report]
fail_under = 95

[tool.mypy]
# The library is checked as the top-level package "aiomeshcom"; the
# integration (which needs Home Assistant) is checked in its own CI job.
files = ["custom_components/meshcom/aiomeshcom", "tests/lib"]
mypy_path = "custom_components/meshcom"
explicit_package_bases = true
strict = true
python_version = "3.13"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "B", "UP", "S", "BLE", "ASYNC", "RUF", "SIM",
    "PL", "PT", "C4", "RET", "TRY", "PERF", "N",
]
ignore = ["PLR2004", "TRY003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S104", "PLR2004", "PLR0913", "SLF001"]

[tool.ruff.lint.isort]
known-first-party = ["aiomeshcom", "custom_components"]

[tool.bandit]
exclude_dirs = ["tests"]
