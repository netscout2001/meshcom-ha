blueprint:
  name: MeshCom – notify with reply
  description: >-
    Sends a push notification to a phone with the Home Assistant Companion
    app when a MeshCom message arrives: direct messages to the node and,
    optionally, messages to chosen groups and to all. The notification has
    a "Reply" button; the answer is sent back with the `meshcom.send_message`
    action into the same conversation.


    Everything sent goes out on amateur radio under the node's callsign.
    Only choose a phone whose owner holds an amateur radio licence: the reply
    is sent by this automation, not checked against the users released in
    the MeshCom options. Only the chosen person can reply: a button press from
    any other Home Assistant user (for example their own Companion app) is
    ignored.
  domain: automation
  source_url: https://github.com/netscout2001/meshcom-ha/blob/main/blueprints/automation/meshcom/notify_with_reply.yaml
  input:
    node:
      name: MeshCom node
      description: The node whose messages are reported and that sends the reply.
      selector:
        config_entry:
          integration: meshcom
    notify_device:
      name: Phone
      description: Device with the Home Assistant Companion app.
      selector:
        device:
          filter:
            - integration: mobile_app
    reply_person:
      name: Person who may reply
      description: >-
        The person who uses the phone. Only a reply sent with this person's
        Home Assistant user is transmitted. The person must have a user.
      selector:
        entity:
          filter:
            - domain: person
    direct_messages:
      name: Direct messages
      description: Notify about direct messages to the node.
      default: true
      selector:
        boolean:
    groups:
      name: Groups
      description: >-
        Group numbers to notify about, separated by commas (e.g. 262, 20).
        Leave empty for none.
      default: ""
      selector:
        text:
    broadcast:
      name: Messages to all
      description: Notify about messages to all ("*").
      default: false
      selector:
        boolean:
    reply_timeout:
      name: Reply possible for
      description: How long the "Reply" button of a notification stays usable.
      default:
        hours: 1
      selector:
        duration:

mode: parallel
max: 10

trigger_variables:
  node_entry: !input node

triggers:
  - trigger: event
    event_type: meshcom_message
    event_data:
      entry_id: "{{ node_entry }}"

variables:
  reply_person: !input reply_person
  direct_messages: !input direct_messages
  broadcast: !input broadcast
  groups_input: !input groups
  group_list: >-
    {{ (groups_input | string).split(',') | map('trim') | reject('eq', '') | list }}
  msg: "{{ trigger.event.data }}"
  kind: "{{ msg.destination_kind }}"
  # Where the answer goes: back to the sender, or into the same group.
  reply_to: >-
    {% if kind == 'direct' %}{{ msg.sender }}{% elif kind == 'broadcast' %}*{% else %}{{ msg.destination }}{% endif %}

conditions:
  # Only events of the integration itself: Home Assistant users can fire
  # events from outside (for example with the Companion app webhook).
  - condition: template
    value_template: "{{ trigger.event.origin | string == 'LOCAL' }}"
  - condition: template
    value_template: >-
      {{ not msg.is_own and (
           (direct_messages and kind == 'direct' and msg.to_me)
           or (kind == 'group' and msg.destination in group_list)
           or (broadcast and kind == 'broadcast')
         ) }}

actions:
  # Unique per run: a button press answers exactly this notification. The
  # random part keeps the id out of the logbook (the run's context id is in it).
  - variables:
      reply_action: "MESHCOM_REPLY_{{ context.id }}_{{ range(100000) | random }}{{ range(100000) | random }}{{ range(100000) | random }}"
      reply_user: "{{ state_attr(reply_person, 'user_id') or '' }}"
  - domain: mobile_app
    type: notify
    device_id: !input notify_device
    # The sender comes first in the text: Home Assistant would otherwise turn
    # radio text such as "[1, 2]" or "True" into a list or a boolean.
    title: >-
      {% if kind == 'direct' %}MeshCom · DM{% elif kind == 'broadcast' %}MeshCom · all{% else %}MeshCom · {{ msg.destination }}{% endif %}
    message: "{{ msg.sender }}: {{ msg.text }}"
    data:
      tag: "meshcom-{{ reply_to }}"
      group: meshcom
      actions:
        - action: "{{ reply_action }}"
          title: Reply
          behavior: textInput
          textInputButtonTitle: Send
          textInputPlaceholder: "Max. 150 bytes"
  # A person without a Home Assistant user cannot reply.
  - condition: template
    value_template: "{{ reply_user != '' }}"
  - wait_for_trigger:
      - trigger: event
        event_type: mobile_app_notification_action
        event_data:
          action: "{{ reply_action }}"
        # Only the chosen person's phone; other users' presses are ignored.
        context:
          user_id: "{{ reply_user }}"
    timeout: !input reply_timeout
    continue_on_timeout: false
  # The reply is never stored in a variable of its own: Home Assistant would
  # turn a text such as "1e5", "True" or "[1, 2]" into a number, a boolean or
  # a list. Rendered as one dictionary, every value stays a string.
  - condition: template
    value_template: "{{ (wait.trigger.event.data.reply_text | default('')) | string | trim != '' }}"
  - action: meshcom.send_message
    data: >-
      {{ {
        'config_entry_id': node_entry | string,
        'destination': reply_to | string,
        'message': (wait.trigger.event.data.reply_text | default('')) | string | trim,
      } }}
