rules:
  # Bronze
  action-setup:
    status: exempt
    comment: No service actions yet; they follow with the send path.
  appropriate-polling:
    status: exempt
    comment: Push integration (UDP), no polling.
  brands: todo
  common-modules: done
  config-flow: done
  config-flow-test-coverage: done
  dependency-transparency: done
  docs-actions:
    status: exempt
    comment: No service actions yet.
  docs-high-level-description: todo
  docs-installation-instructions: todo
  docs-removal-instructions: todo
  entity-event-setup: done
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure: done
  test-before-setup:
    status: exempt
    comment: >-
      The node pushes packets; there is nothing to query at setup. A missing
      node is shown by the "Active" binary sensor instead.
  unique-config-entry: done

  # Silver
  action-exceptions:
    status: exempt
    comment: No service actions yet.
  config-entry-unloading: done
  docs-configuration-parameters: todo
  docs-installation-parameters: todo
  entity-unavailable:
    status: exempt
    comment: >-
      Values come from the last beacon; reachability is a separate
      connectivity sensor, because a mobile node is regularly out of range.
  integration-owner: done
  log-when-unavailable: todo
  parallel-updates: done
  reauthentication-flow:
    status: exempt
    comment: No credentials until the web API (phase 2).
  test-coverage: done

  # Gold
  devices: done
  diagnostics: done
  discovery:
    status: exempt
    comment: The node announces no mDNS service and no other discovery data.
  discovery-update-info:
    status: exempt
    comment: No discovery.
  docs-data-update: todo
  docs-examples: todo
  docs-known-limitations: todo
  docs-supported-devices: todo
  docs-supported-functions: todo
  docs-troubleshooting: todo
  docs-use-cases: todo
  dynamic-devices: todo
  entity-category: done
  entity-device-class: done
  entity-disabled-by-default: done
  entity-translations: done
  exception-translations: done
  icon-translations: todo
  reconfiguration-flow: todo
  repair-issues: todo
  stale-devices: todo

  # Platinum
  async-dependency: done
  inject-websession:
    status: exempt
    comment: No HTTP client yet (web API follows in phase 2).
  strict-typing: done
